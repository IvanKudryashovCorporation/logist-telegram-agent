# Настройки линтера.
#
# Конфига в проекте не было, и `ruff check` со своим набором по умолчанию
# выдавал сотни срабатываний на правила, которым код следует СОЗНАТЕЛЬНО:
#
# * DTZ* — все datetime в проекте наивные по договорённости (наивный UTC для
#   служебных полей и наивный МСК для «гражданского» времени подачи).
#   Подробнее — app/timeutil.py. Требовать tzinfo здесь значит ломать модель
#   данных, а не улучшать её.
# * UP045/UP007 — код написан через typing.Optional/Union; массовый переход на
#   `X | None` дал бы косметический дифф на сотни строк без пользы.
#
# Поэтому выбран короткий набор правил, который ловит настоящие дефекты
# (неиспользуемые имена, порядок импортов, грубые упрощения), и линтер можно
# использовать как гейт перед коммитом:
#
#     python -m ruff check .

target-version = "py310"
# 120, а не 100: в существующем коде уже есть строки до ~115 символов
# (app/parsing/schema.py, scripts/*), и ужесточение лимита дало бы десятки
# косметических правок, не имеющих отношения к надёжности.
line-length = 120

[lint]
select = [
    "E",    # pycodestyle: ошибки
    "W",    # pycodestyle: предупреждения
    "F",    # pyflakes: неиспользуемые/неопределённые имена
    "I",    # isort: порядок импортов
    "B",    # flake8-bugbear: частые источники багов
    "SIM",  # flake8-simplify: упрощаемые конструкции
    "BLE",  # слепые except — только с явным noqa и пояснением
    "RUF",  # правила самого ruff (в т.ч. RUF100 — протухшие noqa)
]
ignore = [
    # Наивные datetime — осознанное решение проекта, см. app/timeutil.py.
    "DTZ001", "DTZ005", "DTZ007", "DTZ011", "DTZ012",
    # typing.Optional/Union вместо `X | None` — стиль существующего кода.
    "UP045", "UP007", "UP035", "UP037",
    # SIM103 предлагает заменить серию «if ...: return False» на один
    # «return not (...)». Во всём проекте фильтры написаны guard-клаузами
    # (app/web/filters.py, app/parsing/prefilter.py) — это читается лучше,
    # чем одно выражение на десять условий.
    "SIM103",
    # RUF001-003 ругаются на «неоднозначные» кириллические символы в строках и
    # комментариях. Проект целиком на русском, так что это срабатывало бы на
    # каждой второй строке и полностью заглушило бы полезные проверки.
    "RUF001", "RUF002", "RUF003",
]

[lint.per-file-ignores]
# Миграции генерирует alembic: править их стиль вручную значит создавать
# конфликт при следующей автогенерации.
"migrations/**" = ["I001", "E501", "W291"]
# Описания полей для LLM — это длинные человекочитаемые строки промпта;
# переносы только ухудшат их читаемость для модели.
"app/parsing/schema.py" = ["E501"]
# В тестах длинная строка с ассертом читается лучше, чем перенос.
"tests/**" = ["E501"]
